services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: backranq_e2e
      POSTGRES_USER: backranq_e2e
      POSTGRES_PASSWORD: backranq_e2e
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backranq_e2e -d backranq_e2e"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
