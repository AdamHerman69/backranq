name: Stockfish runtime compatibility

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: engine-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-stockfish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Stockfish and run a real fixed-node search
        run: pnpm vitest run tests/lib/server-stockfish-client.test.ts
