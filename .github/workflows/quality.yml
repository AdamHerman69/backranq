name: Code quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint, types, unit tests and production build
        run: pnpm check

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: backranq_ci
          POSTGRES_PASSWORD: backranq_ci
          POSTGRES_DB: backranq_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U backranq_ci -d backranq_ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://backranq_ci:backranq_ci@127.0.0.1:5432/backranq_ci?schema=public
      DIRECT_URL: postgresql://backranq_ci:backranq_ci@127.0.0.1:5432/backranq_ci?schema=public

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Supabase API roles
        run: pnpm prisma db execute --schema prisma/schema.prisma --file scripts/ci/prepare-migration-db.sql

      - name: Apply the complete migration chain
        run: pnpm prisma migrate deploy

      - name: Verify migration history is current
        run: pnpm prisma migrate status
